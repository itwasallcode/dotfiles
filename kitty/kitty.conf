# Base
background              #101010
foreground              #e6e6e6

# Typography
font_family      Cascadia Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        16.0

# Window
window_padding_width    12
background_opacity      1.0
window_border_width     1pt
active_border_color     #82aaff
inactive_border_color   #242424
macos_titlebar_color    background

# Cursor
cursor                  #82aaff
cursor_text_color       #101010
cursor_shape            beam
cursor_beam_thickness   2.0

# Selection
selection_foreground    #f5f5f5
selection_background    #3b4261

# Links
url_color               #65d9ef

# Tabs
tab_bar_edge            bottom
tab_bar_style           separator
tab_bar_min_tabs        2
tab_bar_align           left
tab_bar_margin_width    12
tab_bar_margin_height   6.0 6.0
tab_separator           "   "
tab_title_template      "{bell_symbol}{activity_symbol}{index}  {title}"
active_tab_foreground   #82aaff
active_tab_background   #101010
active_tab_font_style   bold
inactive_tab_foreground #8a8a8a
inactive_tab_background #101010
inactive_tab_font_style normal
tab_bar_background      #101010

